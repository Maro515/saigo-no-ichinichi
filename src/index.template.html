<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>最期の一日</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%231a1611%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23e8b76a%27/%3E%3C/svg%3E">
<style>/*__CSS__*/</style>
</head>
<body>
<canvas id="gl" class="gl" aria-hidden="true"></canvas>
<div id="wash" class="wash" aria-hidden="true"></div>
<div id="lidTop" class="lid lid-top" aria-hidden="true"></div>
<div id="lidBot" class="lid lid-bot" aria-hidden="true"></div>

<!-- 体験のあいだ -->
<div id="hud" class="hud" hidden>
  <p class="hud-clock"><span id="hudTime" class="hud-time">00:00</span><span id="hudPlace" class="hud-place"></span></p>
  <div class="hud-actions">
    <button id="btnPace" class="chip" type="button" title="1時間を何分で過ごすか">1時間 2分</button>
    <button id="btnAuto" class="chip" type="button" aria-pressed="true">自動送り</button>
    <button id="btnSound" class="chip" type="button" aria-pressed="true">音あり</button>
    <button id="btnQuit" class="chip" type="button">やめる</button>
  </div>
</div>
<div id="reticle" class="reticle" hidden aria-hidden="true">
  <svg viewBox="0 0 44 44"><circle class="reticle-prog" id="reticleProg" cx="22" cy="22" r="17" pathLength="100"/><circle class="reticle-dot" cx="22" cy="22" r="1.5"/></svg>
</div>
<p id="prompt" class="prompt" aria-live="polite" hidden><span id="promptText"></span><kbd id="promptKey" class="prompt-key"></kbd></p>
<p id="spot" class="spot" aria-hidden="true" hidden></p>
<div id="stick" class="stick" aria-hidden="true" hidden><i id="stickKnob" class="stick-knob"></i></div>
<p id="hint" class="hint" aria-live="polite" hidden></p>
<div id="card" class="card" hidden><div id="cardText" class="card-text" aria-live="polite"></div></div>
<div id="mem" class="mem" hidden><p id="memLabel" class="mem-label"></p><div id="memText" class="mem-text" aria-live="polite"></div></div>
<div id="soma" class="soma" hidden aria-hidden="true"></div>
<!-- ドラマで見るときの、上下の黒い帯とテロップ -->
<div id="bars" class="bars" aria-hidden="true"><i class="bar bar-top"></i><i class="bar bar-bot"></i></div>
<div id="telop" class="telop" aria-live="polite"><p id="telopTime" class="telop-time"></p><p id="telopPlace" class="telop-place"></p><p id="telopLeft" class="telop-left"></p></div>
<div id="narr" class="narr" hidden><p id="narrText" class="narr-text" aria-live="polite"></p></div>
<div id="act" class="act" hidden>
  <button id="btnRest" class="btn btn-quiet" type="button" aria-pressed="false" hidden>目を閉じる</button>
  <button id="btnRecall" class="btn btn-quiet" type="button" hidden>灯を見る</button>
  <button id="btnNext" class="btn btn-quiet" type="button" hidden>つづける</button>
</div>

<!-- はじめの画面 -->
<main id="title" class="title">
  <div class="title-head">
    <h1 class="title-name">最期の一日</h1>
    <p class="title-lead">ある人の、最後の一日を見届けます。<br>それは事故か、事件か、突然の病か。<br>なかには、あとから意味がわかる一日もあります。<br>誰の、どんな一日になるかは、選べません。</p>
  </div>
  <div class="title-foot">
    <p id="titleCount" class="title-count"></p>
    <div class="title-actions">
      <button id="btnStart" class="btn btn-main" type="button">はじめる</button>
      <div class="actions-sub">
        <button id="btnLedger" class="btn btn-quiet" type="button">過去帳</button>
        <button id="btnSound0" class="btn btn-quiet" type="button" aria-pressed="true">音あり</button>
      </div>
    </div>
    <div class="mode" role="group" aria-labelledby="modeLabel">
      <p id="modeLabel" class="pace-label">見かた</p>
      <div class="pace-opts">
        <button class="chip" type="button" data-mode="drama" aria-pressed="true">ドラマで見る</button>
        <button class="chip" type="button" data-mode="free" aria-pressed="false">自分で過ごす</button>
      </div>
      <p id="modeNote" class="pace-note"></p>
    </div>
    <div id="paceBox" class="pace" role="group" aria-labelledby="paceLabel">
      <p id="paceLabel" class="pace-label">1時間を、何分で過ごすか</p>
      <div class="pace-opts">
        <button class="chip" type="button" data-pace="1" aria-pressed="false">1分</button>
        <button class="chip" type="button" data-pace="2" aria-pressed="true">2分</button>
        <button class="chip" type="button" data-pace="3" aria-pressed="false">3分</button>
        <button class="chip" type="button" data-pace="4" aria-pressed="false">4分</button>
        <button class="chip" type="button" data-pace="5" aria-pressed="false">5分</button>
      </div>
      <p id="paceNote" class="pace-note"></p>
    </div>
    <p class="title-note">死を扱います。事故や事件、突然の病で亡くなる場面があります。つらくなったら、いつでもやめてください。</p>
    <p id="titleError" class="title-error" role="alert" hidden></p>
  </div>
</main>

<!-- おわりの画面 -->
<section id="epi" class="epi" hidden aria-labelledby="epiName">
  <div class="epi-stone">
    <h2 id="epiName" class="epi-name"></h2>
    <p id="epiJob" class="epi-line"></p>
    <p id="epiWhen" class="epi-line"></p>
    <p id="epiPlace" class="epi-line"></p>
    <p id="epiCause" class="epi-cause"></p>
  </div>
  <div class="epi-side">
    <div id="epiTwist" class="epi-twist" hidden>
      <p class="epi-twist-label">この一日の、違和感</p>
      <p id="epiTwistQ" class="epi-twist-q"></p>
      <button id="btnTwist" class="btn btn-quiet epi-twist-btn" type="button" aria-expanded="false" aria-controls="epiTwistA">意味を知る</button>
      <p id="epiTwistA" class="epi-twist-a" hidden></p>
    </div>
    <p id="epiNote" class="epi-note"></p>
    <p id="epiMem" class="epi-mem"></p>
    <div class="epi-actions">
      <button id="btnAgain" class="btn btn-main" type="button">別の人生へ</button>
      <div class="actions-sub">
        <button id="btnLedger2" class="btn btn-quiet" type="button">過去帳</button>
        <button id="btnHome" class="btn btn-quiet" type="button">はじめの画面へ</button>
      </div>
    </div>
  </div>
</section>

<!-- 過去帳 -->
<dialog id="ledger" class="ledger" aria-labelledby="ledgerTitle">
  <div class="ledger-head">
    <h2 id="ledgerTitle" class="ledger-title">過去帳</h2>
    <p id="ledgerSum" class="ledger-sum"></p>
  </div>
  <ol id="ledgerList" class="ledger-list"></ol>
  <p id="ledgerEmpty" class="ledger-empty" hidden>まだ、誰も見送っていません。</p>
  <div class="ledger-actions">
    <button id="btnLedgerClose" class="btn btn-main" type="button" autofocus>とじる</button>
    <button id="btnLedgerClear" class="btn btn-quiet" type="button">記録を消す</button>
  </div>
</dialog>

<script type="application/json" id="si-data">__DATA__</script>
<script type="application/octet-stream" id="si-assets">__ASSETS__</script>
<script>/*__THREE__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
